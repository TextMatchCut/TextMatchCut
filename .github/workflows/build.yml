name: Build and Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

env:
  NODE_OPTIONS: "--max-old-space-size=4096"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            platform: linux/amd64
          - os: windows-latest
            goos: windows
            goarch: amd64
            platform: windows/amd64
          - os: macos-latest
            goos: darwin
            goarch: universal
            platform: darwin/universal

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Setup Bun
        # if: runner.os != 'Windows'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # - name: Setup Bun (Windows)
      #   if: runner.os == 'Windows'
      #   run: |
      #     powershell -c "irm bun.sh/install.ps1|iex"
      #     echo "$env:USERPROFILE\.bun\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Add Go bin to PATH (Linux/macOS)
        if: runner.os != 'Windows'
        run: echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: Add Go bin to PATH (Windows)
        if: runner.os == 'Windows'
        run: echo "$env:USERPROFILE\go\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: Build Wails App
        run: wails build

      - name: Create DMG (macOS only)
        if: runner.os == 'macOS'
        run: |
          brew install create-dmg
          #sometimes logo is messed up, idk why
          cp resources/icon/app-icon/icon.icns build/bin/TextMatchCut.app/Contents/Resources/iconfile.icns
          mkdir -p dist
          create-dmg \
            --volname "TextMatchCut" \
            --volicon "resources/icon/app-icon/icon.icns" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --app-drop-link 425 190 \
            "dist/TextMatchCut-${{ github.ref_name || 'dev' }}.dmg" \
            "build/bin/TextMatchCut.app"

      - name: Upload Artifacts (Windows/Linux)
        if: runner.os != 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: TextMatchCut-${{ matrix.goos }}-${{ matrix.goarch }}
          path: build/bin/*

      - name: Upload Artifacts (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: TextMatchCut-darwin-universal
          path: dist/*.dmg

